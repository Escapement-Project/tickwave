# A release: a tag vX.Y.Z builds the web files and the site, adds them to gh-pages (pages.sh: the
# files in vX.Y.Z/, which never change once published, and the site at the root for the highest
# version), then makes the GitHub release with CHANGELOG.md's notes for it.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: The tag names the CLI's version, and CHANGELOG.md has its notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          cli=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/cli/Cargo.toml | head -1)
          if [ "$version" != "$cli" ]; then
            echo "the tag is $GITHUB_REF_NAME, the CLI is $cli" >&2
            exit 1
          fi
          .github/scripts/notes.sh "$version" > "$RUNNER_TEMP/notes.md"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # wasm-bindgen's CLI has to match the crate in Cargo.lock; wasm-opt is binaryen's, pinned by
      # its release's digest.
      - name: wasm-bindgen and wasm-opt
        run: |
          bindgen=$(awk '$0 == "name = \"wasm-bindgen\"" { getline; gsub(/"/, "", $3); print $3; exit }' Cargo.lock)
          cargo install wasm-bindgen-cli --version "$bindgen" --locked
          archive=binaryen-version_133-x86_64-linux.tar.gz
          curl -fsSLo "$RUNNER_TEMP/$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_133/$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $RUNNER_TEMP/$archive" | sha256sum -c
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the decoder and the converter for the browser
        run: |
          crates/wasm/build.sh
          crates/convert-wasm/build.sh

      - name: Build the web files and the site
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Add the release to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pages="$RUNNER_TEMP/pages"
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git worktree add -B gh-pages "$pages" origin/gh-pages
          else
            git worktree add --orphan -b gh-pages "$pages"
          fi
          .github/scripts/pages.sh "${GITHUB_REF_NAME#v}" web/dist "$pages"
          git -C "$pages" push origin gh-pages

      - name: The GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "tickwave $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
