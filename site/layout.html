<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Escapement Project">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{card}}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Escapement Project. tickwave. A web viewer for mixed-signal captures, built to sit inside a page.">
<meta name="twitter:card" content="summary_large_image">
<script>
// .js, as on the project's other pages, for a shared rule that needs a script to run; and a face
// chosen on an earlier visit, applied before the first paint. The project's sites share the key.
document.documentElement.classList.add("js"); try { const f = localStorage.getItem("face"); if (f === "day" || f === "night") document.documentElement.dataset.face = f; } catch {}
</script>
<link rel="preload" href="{{root}}fonts/saira-expanded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}fonts/hanken-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="{{root}}favicon-tickwave.ico">
<link rel="stylesheet" href="{{root}}tokens.css">
<link rel="stylesheet" href="{{root}}base.css">
<link rel="stylesheet" href="{{root}}tickwave.css">
<link rel="stylesheet" href="{{root}}site.css">
<link rel="stylesheet" href="{{root}}doc.css">
<script type="module" src="{{root}}site.js"></script>
</head>
<body class="{{kind}}">
{{header}}
<main id="main"{{main}}>
{{content}}
</main>
{{footer}}
<script src="{{root}}face.js" defer></script>
<script src="{{root}}header.js" defer></script>
<script src="{{root}}copy.js" defer></script>
<script src="{{root}}doc.js" defer></script>
<script src="{{root}}search.js" defer></script>
<script src="{{root}}mark.js" defer></script>
</body>
</html>
