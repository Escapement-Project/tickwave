# The benchmark's own workspace; the chrono workspace excludes `bench`.
[workspace]
resolver = "3"
members = ["native", "libzstd"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# As chrono's own `wasm` profile, so the libzstd build is compared like for like.
[profile.wasm]
inherits = "release"
lto = true
codegen-units = 1
