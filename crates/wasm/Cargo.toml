[package]
name = "tickwave-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
tickwave-format = { version = "0.1.0", path = "../format", default-features = false }
js-sys = "0.3.107"
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
zstd = { version = "0.14.3", default-features = false }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["annotations"]
annotations = ["tickwave-format/annotations"]
