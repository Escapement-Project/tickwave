[package]
name = "escapement-tickwave-wasm"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-format = { version = "0.1.2", path = "../format", default-features = false }
js-sys = "0.3.107"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["annotations"]
annotations = ["escapement-tickwave-format/annotations"]
