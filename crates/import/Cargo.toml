[package]
name = "escapement-tickwave-import"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-format = { version = "0.1.0", path = "../format" }
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.12"
rust-ini = "0.21.3"
thiserror = "2.0.21"
vcd = "0.7.0"
zip = { version = "9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
csv = "1.4.0"
indicatif = "0.18.6"
