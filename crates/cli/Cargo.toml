[package]
name = "tickwave-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
tickwave-format = { version = "0.1.0", path = "../format" }
tickwave-import = { version = "0.1.0", path = "../import" }
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tracing = "0.1.44"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"

[[bin]]
name = "tickwave"
path = "src/main.rs"
