[package]
name = "escapement-tickwave-decode"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-view = { version = "0.1.1", path = "../view", default-features = false, optional = true }
foldhash = "0.2.0"
smallvec = { version = "1.16.6", features = ["union"] }
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }

[features]
default = ["wire", "live"]
# A wire analysis's input read from a recording through the view's cursors. A decoder alone, as
# one built for an external runtime would be, needs only the contract.
wire = ["dep:escapement-tickwave-view"]
# Wire input from a recording a writer in this process is still writing.
live = ["wire", "escapement-tickwave-view/live"]
# Recipes: the analyses to run over a recording, as `[[decode]]` tables name them, bound through a
# registry of decoders.
recipe = ["wire", "dep:toml"]
