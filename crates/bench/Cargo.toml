[package]
name = "escapement-tickwave-bench"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-format = { version = "0.1.2", path = "../format" }
serde_json = "1.0.154"

[dev-dependencies]
egui = { version = "0.37.0", features = ["default_fonts"] }
escapement-tickwave-decode = { path = "../decode" }
escapement-tickwave-decoders = { path = "../decoders" }
escapement-tickwave-egui = { path = "../egui", features = ["decode"] }
escapement-tickwave-view = { path = "../view" }
gungraun = "0.20.0"

[[bench]]
name = "view"
harness = false

[[bench]]
name = "writer"
harness = false

[[bench]]
name = "repair"
harness = false

[[bench]]
name = "egui"
harness = false

[[bench]]
name = "decode"
harness = false
