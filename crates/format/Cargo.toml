[package]
name = "chrono-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
rayon = { version = "1.12.0", optional = true }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }
zstd = { version = "0.14.3", optional = true }

[features]
default = ["encode", "annotations"]
# The encoder needs libzstd and threads; a decoder-only build (the browser's) leaves it out.
encode = ["dep:zstd", "dep:rayon"]
# Sidecar parsing and checks; the TOML parser roughly doubles the browser's WASM module.
annotations = ["dep:toml"]
