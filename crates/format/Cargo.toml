[package]
name = "escapement-tickwave-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }
toml_edit = { version = "0.25.19", optional = true }
# Without its default features: a reader takes only current zstd frames, so the legacy formats'
# decoders would be dead code, 70 KB of it in a WASM build.
zstd = { version = "0.14.3", default-features = false }

[features]
default = ["encode", "annotations", "toml"]
# The encoder needs threads; a decoder-only build (the browser's) leaves it out. A writer splits a
# bundled sidecar's generator files into parts in the order its TOML includes them.
encode = ["dep:rayon", "annotations", "toml"]
# Sidecar checks, with the hand-written file handed in as JSON.
annotations = []
# Sidecar checks reading the hand-written file's TOML. The browser parses TOML in JavaScript
# instead: the parser would cost its decoder more than anything else in it.
toml = ["annotations", "dep:toml"]
# Edits of the hand-written file that keep its comments and layout, for the annotation editor.
edit = ["annotations", "dep:toml_edit"]

[[test]]
name = "edit"
required-features = ["edit"]

[dev-dependencies]
zstd = { version = "0.14.3", default-features = false, features = ["zdict_builder"] }
