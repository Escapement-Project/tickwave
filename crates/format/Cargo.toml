[package]
name = "tickwave-format"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
blake3 = "1.8.7"
rayon = { version = "1.12.0", optional = true }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }
zstd = { version = "0.14.3", optional = true }

[features]
default = ["encode", "annotations", "toml"]
# The encoder needs libzstd and threads; a decoder-only build (the browser's) leaves it out.
encode = ["dep:zstd", "dep:rayon"]
# Sidecar checks, with the hand-written file handed in as JSON.
annotations = []
# Sidecar checks reading the hand-written file's TOML. The browser parses TOML in JavaScript
# instead: the parser would cost its decoder more than anything else in it.
toml = ["annotations", "dep:toml"]
