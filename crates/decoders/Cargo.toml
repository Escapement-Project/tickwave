[package]
name = "escapement-tickwave-decoders"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-decode = { version = "0.1.0", path = "../decode" }
escapement-tickwave-view = { version = "0.1.0", path = "../view", default-features = false, optional = true }
foldhash = "0.2.0"
thiserror = "2.0.21"
toml = { version = "1.2.1", optional = true }

[dev-dependencies]
escapement-tickwave-format = { version = "0.1.0", path = "../format" }
escapement-tickwave-view = { version = "0.1.0", path = "../view" }
fastrand = "2.5.0"

[features]
# Recipes: the analyses to run over a recording, as `[[decode]]` tables name them, bound through
# a registry of these decoders. A host's concern, not a decoder's.
recipe = ["dep:toml", "dep:escapement-tickwave-view"]
