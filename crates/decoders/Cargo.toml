[package]
name = "escapement-tickwave-decoders"
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-decode = { version = "0.1.1", path = "../decode" }
foldhash = "0.2.0"
thiserror = "2.0.21"

[dev-dependencies]
escapement-tickwave-format = { version = "0.1.1", path = "../format" }
escapement-tickwave-view = { version = "0.1.1", path = "../view" }
fastrand = "2.5.0"

[features]
# These decoders as a registry that binds recipes, with their presets. A host's concern, not a
# decoder's.
recipe = ["escapement-tickwave-decode/recipe"]
