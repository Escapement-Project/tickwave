[package]
name = "escapement-tickwave-view"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
escapement-tickwave-format = { version = "0.1.2", path = "../format", default-features = false, features = ["toml"] }
foldhash = "0.2.0"
lru = "0.19.0"
num-bigint = "0.5.1"
num-traits = "0.2.19"
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"

[dev-dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
tracing-chrome = "0.7.2"
tracing-indicatif = "0.3.14"
tracing-subscriber = "0.3.23"

[features]
default = ["live"]
# A view of a recording a writer in the same process is still writing, through its `Snapshot`.
live = ["escapement-tickwave-format/encode"]
