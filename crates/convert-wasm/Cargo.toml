[package]
name = "escapement-tickwave-convert-wasm"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
escapement-tickwave-format = { version = "0.1.2", path = "../format", features = ["edit"] }
escapement-tickwave-import = { version = "0.1.2", path = "../import" }
wasm-bindgen = "0.2.130"
