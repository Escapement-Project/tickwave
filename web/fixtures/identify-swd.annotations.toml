format = "tickwave-annotations/1"
recording = "identify-swd.tickwave"
recording_id = "blake3:ccc8b7d8c3e4cb30da7fc6088e54ebeba2858ad402eb3fb5a9aeb50be989accf"
# Written by scripts/swd-annotations.ts from the recording; not committed.
include = ["identify-swd.swd.jsonl"]

# A view steps through the kind of the first annotation unless it was opened at another.

[[annotation]]
id = "first-wait"
ref = "swd/wait/379065159"
label = "The target answers WAIT"

[[annotation]]
id = "attach"
start = "376.719436 ms"
end = "377.140560 ms"
channels = ["SWCLK", "SWDIO"]
kind = "attach"
label = "Attaching: line reset, select, line reset, then the first read"

[[annotation]]
id = "line-reset"
ref = "swd/reset/376719436"
label = "Line reset: SWDIO held high for 51 clocks"
measure = { channel = "SWCLK", what = "duration" }

[[annotation]]
id = "jtag-to-swd"
ref = "swd/select/376845430"
label = "The JTAG-to-SWD select sequence, 0xE79E"

[[annotation]]
id = "dpidr-read"
ref = "swd/read/377094557"
label = "Reading the debug port's ID register"
text = "A DP read of DPIDR. The probe drives the request; the target drives the acknowledge and the data, 0x6BA02477."
measure = { channel = "SWCLK", what = "rate" }

[[annotation]]
id = "dpidr-request"
ref = "swd/request/377094557"
label = "request 0xA5"

[[annotation]]
id = "dpidr-ack"
ref = "swd/ack/377103058"
label = "ack OK"

# Ends exactly on the line reset's 51st rising edge, which the measure leaves out.
[[annotation]]
id = "reset-clock"
start = 376719436
end = 376774080
channels = ["SWCLK"]
kind = "clock"
label = "The reset's clock, up to its last rising edge"
measure = { channel = "SWCLK", what = "duration" }
