<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One view, set up by the query</title>
<!--
  ?src=   the recording, relative to web/ (default fixtures/identify-swd.tickwave)
  ?site=  the origin the recording is read from, in place of this page's own
  ?tag=   appended to the recording's URL, so the server's log can tell this page's requests apart
  ?annotations=  a sidecar, relative to web/
  ?open   open the view; otherwise it stays collapsed
  ?window=  the view's window attribute
  ?channels=, ?series=  the view's channels and series attributes
  ?download  the view's download attribute; ?title= a title slotted over the recording's
  ?style=   the view's style attribute
  ?below  put the view and a reference to it below the fold
  ?firstRead=N  the decoder's first read of the head, in bytes
  ?after=N&fail=S, ?after=N&stall=MS, ?until=M  passed on to the server with the recording's URL
-->
<script type="module">
import { configure } from "../../dist/tickwave.js";
const q = new URLSearchParams(location.search);
if (q.get("firstRead")) configure({ firstRead: Number(q.get("firstRead")) });
const served = new URLSearchParams([...q].filter(([k]) => ["tag", "after", "until", "fail", "stall"].includes(k)));
const src = `${q.get("site") ? `${q.get("site")}/` : "../../"}${q.get("src") ?? "fixtures/identify-swd.tickwave"}${served.size > 0 ? `?${served}` : ""}`;
const view = document.createElement("tickwave-view");
view.id = "v";
view.setAttribute("src", src);
if (q.get("annotations")) view.setAttribute("annotations", `../../${q.get("annotations")}`);
if (q.has("open")) view.setAttribute("open", "");
if (q.get("window")) view.setAttribute("window", q.get("window"));
for (const name of ["channels", "series"]) if (q.get(name)) view.setAttribute(name, q.get(name));
if (q.has("download")) view.setAttribute("download", "");
if (q.get("title")) view.append(Object.assign(document.createElement("span"), { slot: "title", textContent: q.get("title") }));
if (q.get("style")) view.setAttribute("style", q.get("style"));
if (q.has("shaping")) view.setAttribute("shaping", "");
const ref = document.createElement("tickwave-ref");
ref.setAttribute("for", "v");
ref.setAttribute("annotation", "dpidr-read");
ref.textContent = "the first read";
if (q.has("below")) document.getElementById("spacer").style.height = "3000px";
document.getElementById("here").append(view);
document.getElementById("far").append("See ", ref, ".");
</script>
</head>
<body>
<div id="spacer"></div>
<div id="here"></div>
<div style="height: 3000px"></div>
<p id="far"></p>
</body>
</html>
