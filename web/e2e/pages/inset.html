<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One inset, set up by the query</title>
<!--
  ?src= and ?annotations= relative to web/, ?annotation= the id to show, ?sweep to let it sweep in.
  ?firstRead=N  the decoder's first read of the head, in bytes
  ?tag=, ?after=N&stall=MS and the rest passed on to the server with the recording's URL, as on view.html
-->
<script type="module">
import { configure } from "../../dist/tickwave.js";
const q = new URLSearchParams(location.search);
if (q.get("firstRead")) configure({ firstRead: Number(q.get("firstRead")) });
const served = new URLSearchParams([...q].filter(([k]) => ["tag", "after", "until", "fail", "stall"].includes(k)));
const inset = document.createElement("tickwave-inset");
inset.id = "i";
inset.setAttribute("src", `../../${q.get("src")}${served.size > 0 ? `?${served}` : ""}`);
inset.setAttribute("annotations", `../../${q.get("annotations")}`);
inset.setAttribute("annotation", q.get("annotation"));
if (!q.has("sweep")) inset.setAttribute("sweep", "off");
inset.style.maxWidth = "440px";
document.body.append(inset);
</script>
</head>
<body></body>
</html>
