<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>A recording from a local file</title>
<script type="module">
import { registerFile } from "../../dist/tickwave.js";
document.getElementById("pick").addEventListener("change", (e) => {
  const view = document.createElement("tickwave-view");
  view.id = "v";
  view.setAttribute("src", registerFile(e.target.files[0]));
  view.setAttribute("open", "");
  document.body.append(view);
});
</script>
</head>
<body><input type="file" id="pick" accept=".tickwave"></body>
</html>
